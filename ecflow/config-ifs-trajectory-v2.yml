common:
  small: &small
    qos: nf
    time: 00:45:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 2G
  small_long: &small_long
    qos: nf
    time: 02:00:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 2G
  medium: &medium
    qos: nf
    time: 03:00:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 4G
  large: &large
    qos: nf
    time: 04:30:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 8G   # cropped grid: test build (8 dates) peaked at 1.3 GB; v1 (global) used 128G
  stage: &stage
    qos: nf
    time: '12:00:00'   # quoted: YAML 1.1 reads 12:00:00 as 43200; waiting for tape only, no CPU/memory
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 2G
    # retries: MARS/HPSS server errors (mover outage, server task died) abort a stage, and a
    # failed group blocks every loader whose part needs that cartridge
    ecf_tries: 3

# c2026-11-ifs-finetune-datasets: IFS fc trajectories 2021-2024, cropped to CERRA + 620 km band
# anemoi-datasets create recipe (configs worktree of the campaign)
config: /hpcperm/cu0k/src/campaigns/c2026-11-ifs-finetune-datasets/configs/cerra-ft-od-fc-oper-0001-mars-n320-2021-2024-6h-6h-v2-rmi.yaml
# output zarr.-file
output: /scratch/cu0k/ai-ml/datasets/cerra-ft-od-fc-oper-0001-mars-n320-2021-2024-6h-6h-v2-rmi.zarr
# overwrite previous file (default: False)
overwrite: False
# user-defined cache-dir (default: default cache-dir)
cache : /scratch/cu0k
# number of anemoi-datasets load parts (366 groups of 16 base dates: ~6 groups, ~1 month per part)
load_parts: 61
# number of ecFlow tasks for loading
load_tasks: 20
# maximum number of ecFlow task running at the same time (not-implemented)
max_load_tasks_running: 20
# Calculate additional statistics (default: False)
statistics: True
# number of anemoi-dataset load-additions parts
statistics_parts: 50
# number of ecFlow tasks for loading additions
statistics_tasks: 24
# delta's for which the statistics are calculated
deltas:
  - 6
# Use --trace flage (default: False)
trace: False
# Cleanup after dataset creation (default: False)
cleanup: True
# Patch after dataset creation (default: False)
patch: True
# Name of the conda environment to use (default: no conda environment)
conda_environment: anemoi-datasets

# Just-in-time staging by tape cartridge (family `prestage`, one task per cartridge group, from
# tapegroups.py; a group is staged when a loader whose current part needs it reaches that part),
# then a catch-all `stage_part` per loader part before `run`. Without `tape_groups`: one task
# per month, loaders wait for the months of their part.
prestage:
  # stage: recall to the MARS disk cache, no transfer (blocks until the data is on disk).
  verb: stage
  # concurrent tape-group stage tasks (ecFlow limit); each group touches one cartridge
  max_running: 10
  # directory of tape-group stage requests (cluster.py output, req/)
  tape_groups: /ec/res4/scratch/cu0k/c2026-11-ifs-finetune-datasets/prestage-probe/tapegroups/full-cl2/req
  # MARS requests without date (filled per month, or per part for stage_part); all that the
  # recipe retrieves. anemoi requests stream oper at 00/12 UTC and scda at 06/18 UTC, steps 6-36
  # only (also the from-zero accumulations: no step 0). The tape groups were built from the
  # three tape-prone ones (2026-11-18 probe): scda sfc, oper pl, scda pl.
  requests:
    - &sfc
      class: od
      expver: '0001'
      type: fc
      stream: scda
      time: ['0600', '1800']
      step: 6/to/36/by/6
      levtype: sfc
      param: [2t, 2d, 10u, 10v, 100u, 100v, sp, msl, lsm, skt, tcw, 243.128, rsn, sd, tcc,
              hcc, mcc, lcc, z, strd, ssrd, sf, tp, ssr]
    - <<: *sfc
      stream: oper
      time: ['0000', '1200']
    - &pl
      <<: *sfc
      stream: oper
      time: ['0000', '1200']
      levtype: pl
      levelist: [1, 10, 30, 50, 70, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
      param: [q, t, u, v, z]
    - <<: *pl
      stream: scda
      time: ['0600', '1800']

# SLURM resources for the different tasks
resources:
  init: *small
  prestage: *stage
  load: *large
  final: *small
  init_statistics: *small
  load_statistics: *medium
  final_statistics: *small_long
  cleanup: *small
  patch: *small
