common:
  small: &small
    qos: nf
    time: 00:15:00
    nodes: 1 
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 2G
  medium: &medium
    qos: nf
    time: 00:30:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 4G
  large: &large
    qos: np
    time: 02:00:00
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 1
    mem: 0

# anemoi-datasets create recipe
config: /perm/cu0k/create-datasets/configs/lam-rr-an-oper-0001-mars-5p5km-1984-2020-3h-rmi-v1.yaml
# output zarr.-file
output: /scratch/cu0k/ai-ml/datasets/lam-rr-an-oper-0001-mars-5p5km-1984-2020-3h-rmi-v1.zarr
# overwrite previous file (default: False)
overwrite: False
# user-defined cache-dir (default: default cache-dir)
cache : /scratch/cu0k
# number of anemoi-datasets load parts
load_parts: 200
# number of ecFlow tasks for loading
load_tasks: 40
# maximum number of ecFlow task running at the same time (not-implemented)
max_load_tasks_running: 10
# Calculate additional statistics (default: False)
statistics: True
# number of anemoi-dataset load-additions parts
statistics_parts: 50
# number of ecFlow tasks for loading additions
statistics_tasks: 10
# delta's for which the statistics are calculated
deltas:
  - 3
  - 6
  - 12
  - 24
# Use --trace flage (default: False)
trace: False
# Cleanup after dataset creation (default: False)
cleanup: True
# Patch after dataset creation (default: False)
patch: True
# Name of the conda environment to use (default: no conda environment)
conda_environment: anemoi-datasets-dev
# SLURM resources for the different tasks
resources:
  init: *small
  load: *large
  final: *small
  init_statistics: *small
  load_statistics: *medium
  final_statistics: *small
  cleanup: *small
  patch: *small


